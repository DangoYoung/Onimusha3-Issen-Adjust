; Onimusha 3 Issen cue. Edit this file beside Onimusha3.IssenCue.asi and restart.
; Use a dot for decimals. Missing or invalid values use the built-in defaults.
; Onimusha3.IssenWindow.ini still controls the original supplemental Issen timing patch.

; 1 shows the named overlay, 0 hides it. Miss markers can be shown independently.
[Display]
Direct=1
Chain=1
DirectMiss=1
; White dashed ring when the game selects a target but cannot commit.
DirectRejected=1
ChainMiss=1
; One retention time for an input result and its band. 0 hides both immediately.
InputHoldMs=2000

; Radii and stroke sizes are in pixels at a 900-pixel viewport height.
; PixelsPerFrame controls both the shrink rate and each frame's band thickness.
; Heights are game world units above the actor's position.
[Geometry]
InnerRadius=42
; Maximum radius in pixels at 900p. 0 removes the cap.
MaxRadius=300
PixelsPerFrame=7
RingWidth=2.15
RingHalo=1.10
BandEdgeWidth=0.8
EnemyHeight=90
TallEnemyHeight=170
PlayerHeight=90

; Later windows appear at most this many animation frames before opening.
[Direct]
NextWindowLeadFrames=12

; MaxFrames sets the early/late tolerance. Zero disables both miss markers.
; Sizes are in pixels at a 900-pixel viewport height. Colors use AARRGGBB hex.
[NearMiss]
MaxFrames=10
MinRadius=14
StrokeWidth=1.2
StrokeHalo=0.65
LabelPixelSize=1.8
EarlyColor=FF78E7FA
LateColor=FFFF967B
HaloColor=D812191F
LabelBackground=D912191F

; AARRGGBB hex. Idle is outside an accepted window. Active is the gold cue.
[DirectColors]
RejectedLine=FFFFFFFF
IdleEdge=B4FFDCA4
IdleFill=67E8B25E
IdleLine=F2FFF3D5
IdleHalo=BC151319
ActiveEdge=DFFFE29B
ActiveFill=84FFD05A
ActiveLine=FFFFD05A
ActiveHalo=DC9A4505

; AARRGGBB hex. Active is the open chain window.
[ChainColors]
IdleEdge=C8C6AAFF
IdleFill=786F56CB
IdleLine=F2E0CEFF
IdleHalo=BC181128
ActiveEdge=FFF1DAFF
ActiveFill=96AE79FF
ActiveLine=FFEDC3FF
ActiveHalo=E05A279B
